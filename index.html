<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Pokémon Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Mini Pokémon Game</h1>

<div id="tabs">
  <button class="tabBtn" data-tab="start">Start</button>
  <button class="tabBtn" data-tab="wild">Wild</button>
  <button class="tabBtn" data-tab="party">Party</button>
  <button class="tabBtn" data-tab="boxes">Boxes</button>
  <button class="tabBtn" data-tab="shop">Shop</button>
</div>

<div id="start" class="tabSection">
  <p id="oakText">Hello! Choose your starter Pokémon!</p>
  <button class="starterBtn" data-starter="Bulbasaur">Bulbasaur</button>
  <button class="starterBtn" data-starter="Charmander">Charmander</button>
  <button class="starterBtn" data-starter="Squirtle">Squirtle</button>
</div>

<div id="wild" class="tabSection" style="display:none;">
  <p id="pokeballText"></p>
  <button id="exploreBtn" style="display:none;">Explore</button>
  <button id="catchBtn" style="display:none;">Throw Pokéball</button>
  <p id="result"></p>
</div>

<div id="party" class="tabSection" style="display:none;">
  <h3>Your Party (click to send to box)</h3>
  <ul id="partyList"></ul>
</div>

<div id="boxes" class="tabSection" style="display:none;">
  <h3>Your Boxes (click to add to party)</h3>
  <ul id="boxList"></ul>
</div>

<div id="shop" class="tabSection" style="display:none;">
  <h3>Poké Mart</h3>
  <p id="shopMoney"></p>
  <button id="buyBallBtn">Buy Pokéball (₽200)</button>
</div>

<script src="pokemon.js"></script>
<script src="game.js"></script>
</body>
</html>
